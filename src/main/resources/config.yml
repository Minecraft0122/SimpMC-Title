# SimpMC-Title 1.1.0
# 文本支持传统颜色代码，例如 &a；也支持 RGB，例如 &#55ccff 或 <#55ccff>。

language: zh_CN

display:
  # 默认显示的称号 ID。设置为空字符串即可关闭默认称号。
  default-title: newbie
  title-separator: " &7"
  chat:
    enabled: true
    # %title% 和 %name% 会被替换；%2$s 必须保留，它代表聊天内容。
    format: "%title%%name% &8» &r%2$s"
  tab:
    enabled: true
    format: "%title%%name%"
  head:
    enabled: true
    format: "%title%%name%"

nickname:
  max-length: 16
  # 只允许字母、数字、下划线、短横线、空格和中文等 Unicode 字符。
  pattern: "^[\\p{L}\\p{N}_\\- ]+$"
  default-color: "<white>"

# 称号文本内容策略。策略会在启动和重载时校验 titles.*.display，违规称号不会加载。
content:
  enabled: true
  max-length: 24
  allow-placeholders: false
  # 允许 Unicode 字母、数字、空格、常用括号和标点。颜色代码会在校验前移除。
  allowed-pattern: "^[\\p{L}\\p{N}\\p{Zs}\\[\\]【】()（）_+\\-·.!?！？:：]+$"
  banned-words:
    - "管理员"
    - "服主"
    - "作弊"
    - "外挂"
  banned-patterns: []

# 经济设置。金币需要服务器安装 Vault 以及一个 Vault Economy 提供者；内部货币由本插件保存。
economy:
  # 未填写支付方式时使用：gold 或 internal。
  default-purchase-method: internal
  purchase:
    # 限时称号重复购买时是否延长有效期；永久称号不会重复扣款。
    allow-renewal: true
  gold:
    enabled: true
    purchase-enabled: true
    exchange-enabled: true
  internal:
    enabled: true
    purchase-enabled: true
    name: "称号币"
    initial-balance: 0
  exchange:
    enabled: true
    # 消耗多少金币兑换 1 个内部货币，兑换结果向下取整。
    gold-per-internal: 100.0
    # 单次兑换的最低金币数量。
    minimum-gold: 100.0

# 审计日志使用 JSON Lines 格式，每次行为一行，方便检索和导入其他工具。
audit:
  enabled: true
  file: logs/actions.log
  max-file-size-mb: 10
  command-limit: 10

titles:
  newbie:
    display: "&8[&7新手&8]"
    description: "刚刚来到服务器的玩家"
    icon: NAME_TAG
    permission: ""
    purchase:
      enabled: false
      days: 0
      gold: 0
      internal: 0
  explorer:
    display: "&8[&#55ccff探索者&8]"
    description: "喜欢发现新世界"
    icon: COMPASS
    permission: "simpmctitle.title.explorer"
    purchase:
      enabled: true
      days: 0
      gold: 5000.0
      internal: 50
  supporter:
    display: "&8[&d支持者&8]"
    description: "感谢你对服务器的支持"
    icon: DIAMOND
    permission: "simpmctitle.title.supporter"
    purchase:
      enabled: true
      days: 30
      gold: 15000.0
      internal: 150

colors:
  - "<white>"
  - "<gray>"
  - "<red>"
  - "<gold>"
  - "<yellow>"
  - "<green>"
  - "<aqua>"
  - "<blue>"
  - "<light_purple>"
  - "<#55ccff>"
  - "<gradient:#55ccff:#b36bff>"

