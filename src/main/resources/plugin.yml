name: SimpMC-Title
version: 1.5.0
main: cn.simpmc.title.SimpMCTitlePlugin
api-version: '1.20'
folia-supported: true
author: SimpMC
description: 称号商城、双货币、昵称与玩家展示管理插件
softdepend:
  - PlaceholderAPI
  - Vault
  - TAB
  - TAB-Bridge
commands:
  simpmctitle:
    description: 管理称号商城、称号、昵称和玩家展示效果
    aliases:
      - smtitle
      - smctitle
    usage: /smtitle help
permissions:
  simpmctitle.title.hide:
    description: 允许手动取消称号后在聊天中不展示任何称号；默认包括 OP 均关闭
    default: false
  simpmctitle.use:
    description: 使用 SimpMC-Title 的玩家功能
    default: true
  simpmctitle.nickname:
    description: 修改自己的昵称和名字颜色
    default: true
  simpmctitle.shop:
    description: 打开称号商城
    default: true
  simpmctitle.purchase:
    description: 购买称号
    default: true
  simpmctitle.balance:
    description: 查看金币和插件内部货币余额
    default: true
  simpmctitle.exchange:
    description: 将金币兑换为插件内部货币
    default: true
  simpmctitle.audit:
    description: 查看称号插件审计记录
    default: op
  simpmctitle.admin:
    description: 管理玩家称号、昵称和名字颜色
    default: op
  simpmctitle.reload:
    description: 重载 SimpMC-Title 配置
    default: op
  simpmctitle.title.*:
    description: 使用所有配置中的称号
    default: false
